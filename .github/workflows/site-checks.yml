name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-site:
    name: validate-site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate site
        run: node scripts/check-site.mjs
